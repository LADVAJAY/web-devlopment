<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        .box{
            border: 2px solid black;
            padding:34px;
            box-shadow:15px 15px 50px rgb(255, 111, 111);
            
        }
        .text{
            text-shadow: 4px 4px 4px rgb(255, 111, 111);
        }
    </style>
</head>
<body>
    <div class="box">
        <p class="text">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Nobis!</p>
    </div>
</body>
</html>
