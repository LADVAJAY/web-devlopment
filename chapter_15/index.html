<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <style>
        /* Element selector  */
        div{
            background-color: yellow;
        }
        /* Class Selector */
        .red{
            background-color: red;
        }
    </style>
</head>
<body>
    <div>
        i am red         
    </div>
    <div class="red">
        i am red         
    </div>

</body>
</html>
