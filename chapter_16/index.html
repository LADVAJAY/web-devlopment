<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin&padding</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            background-color: black;
        }
        .box1{
            color:blue;
            padding:10px;
            margin:20px;
        }
        .box2{
            color:burlywood;
            padding:10px;
            margin:20px;
        }
    </style>
</head>
<body>
    <div class="box box1">
        i am box
    </div>
    <div class="box box2"> 
        i am another box
    </div>
</body>
</html>
